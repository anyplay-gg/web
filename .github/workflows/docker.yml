name: docker

# The production image builds. Only when the Dockerfile, its context rules or the lockfile change:
# the `check` job does not build the image, and a Dockerfile that stopped building would be found
# at the next deploy otherwise.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: false
