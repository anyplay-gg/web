name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main each get their own
# group (the run id) and are never cancelled: merge-notify and the deploy depend on them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types, unit tests, the generated colour file and the production build.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version`: pnpm/action-setup reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Colour roles match their spec
        run: node scripts/gen-ramps.mjs --check
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: node scripts/check-bundle.mjs

  # The browser tests run against `next dev` on the in-memory mock (no cloud), at 375 and 1280 px.
  # One runner per Playwright project (phone, desktop) side by side: each runs the whole suite at its
  # width, and the two together took 357 s on one runner. `e2e` below is the one check name the
  # repository counts.
  e2e-shard:
    name: e2e-shard ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both projects (Pixel 7 emulation and desktop) run on Chromium; no other browser is needed.
      - name: Install Chromium
        run: pnpm --filter @anyplay/web exec playwright install --with-deps chromium
      - name: Playwright
        # One worker: the tests share one `next dev` server, which compiles each route on first hit.
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm --filter @anyplay/web exec playwright test --workers=1 --project="$PROJECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-${{ matrix.project }}
          path: apps/web/test-results
          if-no-files-found: ignore

  # The check name the repository counts. Green only when both shards are.
  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Playwright shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "shards: $SHARDS"
          [ "$SHARDS" = success ]

  # Links, title IDs in code, licences and advisories: the rules every AnyPlay repository shares.
  rules:
    uses: anyplaynet/.github/.github/workflows/rules.yml@main
